
backend:
  name: github
  repo: mamamoostars-maker/tecnas-site-teste
  branch: main
  base_url: https://tecnas-cms-oauth-teste.mamamoostars.workers.dev
  auth_endpoint: auth

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "paginas"
    label: "Páginas do site"
    files:
      - label: "Página inicial"
        name: "inicio"
        file: "conteudo/inicio.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Texto", name: "body", widget: "markdown" }
